name: Validate Entity Registry

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: entity-registry-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Schema and identity validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate registry
        run: python scripts/validate_registry.py
      - name: Validate pinned consumer snapshots
        run: python scripts/validate_consumers.py
